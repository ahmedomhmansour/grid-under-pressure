name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt && pip install -e .
      - name: Unit tests
        run: pytest -q
      - name: Pipeline smoke test (synthetic data, no API key)
        run: python -m gup.pipeline --demo --draws 100
