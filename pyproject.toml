[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-under-pressure"
version = "0.1.0"
description = "Forecast, capacity-expansion and reliability model for Dominion's PJM zone under data-center growth"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=14",
  "requests>=2.31",
  "pyyaml>=6",
  "scikit-learn>=1.4",
  "holidays>=0.40",
  "pulp>=2.8,<4",  # PuLP 4 is a breaking API rewrite
  "highspy>=1.7",
  "matplotlib>=3.8",
  "plotly>=5.18",
  "streamlit>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  # classic PuLP API is deprecated in PuLP 3.3 ahead of the v4 rewrite; we pin <4
  "ignore::DeprecationWarning:pulp.*",
]
